<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Mahasiswa - Tugas 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffe6ea;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .card {
            background-color: #ffffff;
            width: 350px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 2px solid #ffb6c1;
        }

        .foto-profil {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff69b4;
            margin-bottom: 15px;
        }

        h2 {
            color: #d81b60;
            margin-bottom: 20px;
        }

        .info-biodata {
            text-align: left;
            line-height: 1.8;
            color: #333333;
            font-size: 14px;
        }

        .info-biodata strong {
            color: #c2185b;
        }

        .deskripsi {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #ffb6c1;
            font-style: italic;
            color: #555555;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Foto Mahasiswa -->
        <img src="foto profile/Foto.jpeg" alt="Foto Profil" class="foto-profil">

        <h2>Biodata Mahasiswa</h2>

        <!-- Detail Biodata Sesuai Perintah -->
        <div class="info-biodata">
            <p><strong>Nama:</strong> Regita Azizah Nuraini</p>
            <p><strong>NIM:</strong> 2513020019</p>
            <p><strong>Alamat:</strong> Kediri, Jawa Timur</p>
            <p><strong>TTL:</strong> Tarakan, 25 April 2007</p>
            
            <div class="deskripsi">
                <p><strong>Deskripsi Singkat:</strong></p>
                <p>Saya mahasiswi Sistem Informasi yang sedang belajar pemrograman web dasar, perancangan basis data, dan analisis sistem.</p>
            </div>
        </div>
    </div>

</body>
</html>
