<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tkalkulator</h1>

    <script type="text/javascript">
        let angka1 = prompt("Masukkan angka pertama:");
        let angka2 = prompt("Masukkan angka kedua:");

        //untuk menjumlahkan kedua angka 
        let penjumlahan = parseFloat(angka1) + parseFloat(angka2);

        //menampilkan hasil penjumlahan
        document.write("Hasil penjumlahan " + angka1 + " + " + angka2 + " = " + penjumlahan);
    </script>
</body>
</html>
