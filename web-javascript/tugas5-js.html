<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perulangan Javascript</title>
</head>
<body>
    <!-- perulangan FOR -->
     <script type="text/javascript">
         
        for( var i=1; i<=10; i++) {
 
            document.write('<p>Angka ke - '+i+'</p>');
 
        } 
 
    </script>

    <!-- perulangan WHILE -->
     <script type="text/javascript">
        var a=0;
 
        while(a<15) {
 
            document.write('<p>Tulisan ini diulang 15 kali</p>');
 
            a+=1;
        }
    </script>

    <!-- Perulangan DO/WHILE -->
     <script type="text/javascript">
        var a=0;
 
        do {
 
            document.write('<p>Angka ke - '+a+'</p>');
 
            a+=1;
 
        } while(a<10);
    </script>

    <!-- Perulangan FOREACH -->
     <script type="text/javascript">
         
        document.write('<h2>Daftar Siswa</h2>');
 
        var siswa = ['Regita', 'Devana', 'Titania', 'Kevin', 'Fensa'];
         
        siswa.forEach(function(i){
            document.write('<p>'+i+'</p>');
        });     
 
    </script>
</body>
</html>
